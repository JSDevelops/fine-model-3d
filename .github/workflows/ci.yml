name: CI — Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-admin:
    name: Build Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fineverse-admin/package-lock.json
      - run: npm ci
        working-directory: fineverse-admin
      - run: npm run build
        working-directory: fineverse-admin

  check-student:
    name: Build Student
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fineverse-student/package-lock.json
      - run: npm ci
        working-directory: fineverse-student
      - run: npm run build
        working-directory: fineverse-student
